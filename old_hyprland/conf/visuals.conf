decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.88
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 15
        render_power = 2
        color = rgba(0a0a0f99)
        offset = 0 4
    }

    blur {
        enabled = false
    }
}

animations {
    enabled = true

    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = smoothOut, 0.5, 0, 0.99, 0.99
    bezier = smoothIn, 0.5, -0.5, 0.68, 1.5
    bezier = cinematic, 0.25, 0.46, 0.45, 0.94
    bezier = bounce, 0.68, -0.55, 0.265, 1.55

    animation = windows, 1, 6, overshot, slide
    animation = windowsIn, 1, 5, overshot, popin 80%
    animation = windowsOut, 1, 4, smoothOut, popin 80%
    animation = windowsMove, 1, 5, bounce, slide

    animation = border, 1, 8, default
    animation = borderangle, 1, 60, linear, loop

    animation = fade, 1, 5, cinematic
    animation = fadeIn, 1, 5, cinematic
    animation = fadeOut, 1, 4, smoothOut

    animation = workspaces, 1, 6, overshot, slide
    animation = specialWorkspace, 1, 5, overshot, slidevert
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
}
