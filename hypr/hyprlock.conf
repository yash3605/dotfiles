background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.5
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    outer_color = rgb(7aa2f7)
    inner_color = rgb(09090f)
    font_color = rgb(c0caf5)
    fade_on_empty = true
    placeholder_text = password
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M %p")"
    color = rgba(c0caf5ff)
    font_size = 64
    font_family = GeistMono Nerd Font Bold
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(7aa2f7ff)
    font_size = 18
    font_family = GeistMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}
