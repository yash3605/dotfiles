monitor=eDP-1,preferred,auto,1

source = ~/.config/hypr/conf/autostart.conf
source = ~/.config/hypr/conf/visuals.conf
source = ~/.config/hypr/conf/keybinds.conf
source = ~/.config/hypr/conf/windowrules.conf

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    kb_options = caps:swapescape
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

general {
    gaps_in = 5
    gaps_out = 12
    border_size = 1
    col.active_border = rgba(7aa2f7ff) rgba(bb9af7ff) rgba(7dcfffff) 45deg
    col.inactive_border = rgba(ffffff10)
    layout = dwindle
    resize_on_border = true
}

dwindle {
    pseudotile = true
    preserve_split = true
}
